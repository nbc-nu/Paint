<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Paint 16x16 HD para TurboWarp</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(16, 24px);
            grid-template-rows: repeat(16, 24px);
            gap: 1px;
            background-color: #d3d3d3; /* Linhas do grid cinza claro */
            border: 2px solid #d3d3d3;
        }
        .pixel {
            width: 24px;
            height: 24px;
            background-color: #ffffff; /* Fundo branco */
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="colorPicker">Cor: </label>
        <input type="color" id="colorPicker" value="#000000">
        <button id="clearBtn">Limpar Tudo</button>
    </div>

    <!-- Grid de Pintura -->
    <div id="grid"></div>

    <!-- Canvas em Alta Definição (512x512) para evitar borrões no TurboWarp -->
    <canvas id="hdCanvas" width="512" height="512" style="display:none;"></canvas>

    <script>
        const grid = document.getElementById('grid');
        const colorPicker = document.getElementById('colorPicker');
        const clearBtn = document.getElementById('clearBtn');
        const canvas = document.getElementById('hdCanvas');
        const ctx = canvas.getContext('2d');

        // Configura o canvas para manter as bordas dos pixels perfeitamente nítidas (Pixel Art)
        ctx.imageSmoothingEnabled = false;

        // Inicializa a estrutura do localStorage se não existir
        if (!localStorage.getItem('Image')) {
            localStorage.setItem('Image', JSON.stringify({ color: "#000000", image: "" }));
        }

        let storageData = JSON.parse(localStorage.getItem('Image'));
        colorPicker.value = storageData.color;

        // Atualiza a cor no LocalStorage
        colorPicker.addEventListener('input', (e) => {
            storageData.color = e.target.value;
            saveToStorage();
        });

        // Cria os 256 blocos do grid
        for (let i = 0; i < 256; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            
            pixel.addEventListener('click', () => {
                const currentColor = colorPicker.value;
                
                if (pixel.style.backgroundColor === hexToRgb(currentColor)) {
                    pixel.style.backgroundColor = '#ffffff';
                } else {
                    pixel.style.backgroundColor = currentColor;
                }
                
                updateImageURI();
            });

            grid.appendChild(pixel);
        }

        clearBtn.addEventListener('click', () => {
            document.querySelectorAll('.pixel').forEach(p => p.style.backgroundColor = '#ffffff');
            updateImageURI();
        });

        // Desenha a imagem em alta resolução e injeta no LocalStorage
        function updateImageURI() {
            const pixels = document.querySelectorAll('.pixel');
            const pixelSize = 32; // Cada pixel do grid vai ocupar um bloco de 32x32 pixels reais no canvas

            pixels.forEach((pixel, index) => {
                const x = (index % 16) * pixelSize;
                const y = Math.floor(index / 16) * pixelSize;
                
                ctx.fillStyle = pixel.style.backgroundColor || '#ffffff';
                ctx.fillRect(x, y, pixelSize, pixelSize);
            });

            // Gera o Data URI em alta definição
            storageData.image = canvas.toDataURL('image/png');
            saveToStorage();
        }

        function saveToStorage() {
            localStorage.setItem('Image', JSON.stringify(storageData));
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Execução inicial
        updateImageURI();
    </script>
</body>
</html>
