<!DOCTYPE html>
<html lang="utf-8">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>iframe turbowarp paint</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            margin: 5px 0;
            animation-name: rainbow;
            animation-duration: 5s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes rainbow {
            0% { color: #ff0000; }
            17% { color: #ffff00; }
            33% { color: #00ff00; }
            50% { color: #00ffff; }
            67% { color: #0000ff; }
            83% { color: #ff00ff; }
            100% { color: #ff0000; }
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(16, 18px);
            grid-template-rows: repeat(16, 18px);
            gap: 1px;
            background-color: #d3d3d3; 
            border: 2px solid #d3d3d3;
        }
        .pixel {
            width: 18px;
            height: 18px;
            background-color: #ffffff; 
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="colorPicker">Cor: </label>
        <input type="color" id="colorPicker" value="#000000">
        <button id="clearBtn">Erase</button>
    </div>


    <div id="grid"></div>

    <canvas id="hdCanvas" width="256" height="256" style="display:none;"></canvas>

    <script>
        const grid = document.getElementById('grid');
        const colorPicker = document.getElementById('colorPicker');
        const clearBtn = document.getElementById('clearBtn');
        const canvas = document.getElementById('hdCanvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;


        for (let i = 0; i < 256; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            

            pixel.dataset.painted = "false";
            
            pixel.addEventListener('click', () => {
                const currentColor = colorPicker.value;
                

                if (pixel.dataset.painted === "true") {
                    pixel.style.backgroundColor = '#ffffff';
                    pixel.dataset.painted = "false";
                } else {
                    pixel.style.backgroundColor = currentColor;
                    pixel.dataset.painted = "true";
                }
                
                sendImageToTurboWarp();
            });

            grid.appendChild(pixel);
        }


        clearBtn.addEventListener('click', () => {
            document.querySelectorAll('.pixel').forEach(p => {
                p.style.backgroundColor = '#ffffff';
                p.dataset.painted = "false";
            });
            sendImageToTurboWarp();
        });


        function sendImageToTurboWarp() {
            const pixels = document.querySelectorAll('.pixel');
            const blockSize = 16; 


            ctx.clearRect(0, 0, canvas.width, canvas.height);

            pixels.forEach((pixel, index) => {
                const x = (index % 16) * blockSize;
                const y = Math.floor(index / 16) * blockSize;
                

                if (pixel.dataset.painted === "true") {
                    ctx.fillStyle = pixel.style.backgroundColor;
                    ctx.fillRect(x, y, blockSize, blockSize);
                }
            });


            const dataURI = canvas.toDataURL('image/png');
            

            window.parent.postMessage(dataURI, "*");
        }


        sendImageToTurboWarp();
    </script>
</body>
</html>
