<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>TurboWarp Mini Paint Iframe</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: transparent; /* Permite fundo transparente no TurboWarp */
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            margin: 5px 0;
            animation-name: rainbow;
            animation-duration: 5s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes rainbow {
            0% { color: #ff0000; }
            17% { color: #ffff00; }
            33% { color: #00ff00; }
            50% { color: #00ffff; }
            67% { color: #0000ff; }
            83% { color: #ff00ff; }
            100% { color: #ff0000; }
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(16, 18px);
            grid-template-rows: repeat(16, 18px);
            gap: 1px;
            background-color: #d3d3d3; /* Grid cinza claro */
            border: 2px solid #d3d3d3;
        }
        .pixel {
            width: 18px;
            height: 18px;
            background-color: #ffffff; /* Fundo branco padrão */
            cursor: pointer;
            user-select: none;
        }
        .received {
            margin-top: 5px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Mini Paint 16x16</h1>
    
    <div class="controls">
        <label for="colorPicker">Cor: </label>
        <input type="color" id="colorPicker" value="#000000">
        <button id="clearBtn">Limpar</button>
    </div>

    <!-- Grid de Pintura -->
    <div id="grid"></div>

    <!-- Mensagem recebida para debug (opcional) -->
    <p class="received"></p>

    <!-- Canvas para gerar o PNG limpo e nítido -->
    <canvas id="hdCanvas" width="256" height="256" style="display:none;"></canvas>

    <script>
        const grid = document.getElementById('grid');
        const colorPicker = document.getElementById('colorPicker');
        const clearBtn = document.getElementById('clearBtn');
        const canvas = document.getElementById('hdCanvas');
        const ctx = canvas.getContext('2d');

        // Mantém os pixels nítidos (Pixel Art) sem borrar
        ctx.imageSmoothingEnabled = false;

        // Monta o grid visual 16x16
        for (let i = 0; i < 256; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            
            pixel.addEventListener('click', () => {
                const currentColor = colorPicker.value;
                
                // Se re-clicar na mesma cor, apaga (volta para branco)
                if (pixel.style.backgroundColor === hexToRgb(currentColor)) {
                    pixel.style.backgroundColor = '#ffffff';
                } else {
                    pixel.style.backgroundColor = currentColor;
                }
                
                sendImageToTurboWarp();
            });

            grid.appendChild(pixel);
        }

        // Botão para limpar a tela
        clearBtn.addEventListener('click', () => {
            document.querySelectorAll('.pixel').forEach(p => p.style.backgroundColor = '#ffffff');
            sendImageToTurboWarp();
        });

        // Desenha no canvas e envia o Data URI via postMessage imediatamente
        function sendImageToTurboWarp() {
            const pixels = document.querySelectorAll('.pixel');
            const blockSize = 16; // 16 blocos de 16x16 = 256px de resolução nítida

            pixels.forEach((pixel, index) => {
                const x = (index % 16) * blockSize;
                const y = Math.floor(index / 16) * blockSize;
                
                ctx.fillStyle = pixel.style.backgroundColor || '#ffffff';
                ctx.fillRect(x, y, blockSize, blockSize);
            });

            // Gera o Data URI em PNG de alta qualidade
            const dataURI = canvas.toDataURL('image/png');
            
            // ENVIA DIRETO PARA O TURBOWARP (substitui o botão de "Send" manual)
            window.parent.postMessage(dataURI, "*");
        }

        // Escuta se o TurboWarp quiser enviar mensagens de volta para o Iframe
        window.addEventListener("message", (e) => {
            if (e.source === window.parent && e.source !== window) {
                document.querySelector(".received").textContent = `Mensagem do TurboWarp: ${e.data}`;
                
                // Exemplo: Se o TurboWarp enviar uma cor em HEX, atualiza o colorPicker daqui
                if (e.data && e.data.startsWith('#') && e.data.length === 7) {
                    colorPicker.value = e.data;
                }
            }
        });

        // Auxiliar para detectar a cor atual do pixel
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Envia uma imagem em branco logo ao carregar a página
        sendImageToTurboWarp();
    </script>
</body>
</html>
