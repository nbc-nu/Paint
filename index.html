<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>TurboWarp Mini Paint Transparente</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: transparent; /* Permite que o fundo do iframe também seja invisível se quiser */
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            margin: 5px 0;
            animation-name: rainbow;
            animation-duration: 5s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes rainbow {
            0% { color: #ff0000; }
            17% { color: #ffff00; }
            33% { color: #00ff00; }
            50% { color: #00ffff; }
            67% { color: #0000ff; }
            83% { color: #ff00ff; }
            100% { color: #ff0000; }
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(16, 18px);
            grid-template-rows: repeat(16, 18px);
            gap: 1px;
            background-color: #d3d3d3; /* Linhas do grid cinza claro */
            border: 2px solid #d3d3d3;
        }
        .pixel {
            width: 18px;
            height: 18px;
            /* Fundo quadriculado cinza e branco para indicar transparência (tipo "ar") */
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 8px 8px;
            background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
            background-color: #ffffff;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <h1></h1>
    
    <div class="controls">
        <label for="colorPicker">Cor: </label>
        <input type="color" id="colorPicker" value="#000000">
        <button id="clearBtn">Limpar Tudo</button>
    </div>

    <!-- Grid de Pintura -->
    <div id="grid"></div>

    <!-- Canvas HD oculto -->
    <canvas id="hdCanvas" width="256" height="256" style="display:none;"></canvas>

    <script>
        const grid = document.getElementById('grid');
        const colorPicker = document.getElementById('colorPicker');
        const clearBtn = document.getElementById('clearBtn');
        const canvas = document.getElementById('hdCanvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        // Monta o grid 16x16
        for (let i = 0; i < 256; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            
            pixel.addEventListener('click', () => {
                const currentColor = colorPicker.value;
                
                // Se clicar em um pixel que já tem a cor selecionada, ele vira transparente (remove a cor de fundo)
                if (pixel.style.backgroundColor === hexToRgb(currentColor)) {
                    pixel.style.backgroundColor = '';
                } else {
                    pixel.style.backgroundColor = currentColor;
                }
                
                sendImageToTurboWarp();
            });

            grid.appendChild(pixel);
        }

        // Botão para limpar a tela toda (tudo vira transparente)
        clearBtn.addEventListener('click', () => {
            document.querySelectorAll('.pixel').forEach(p => p.style.backgroundColor = '');
            sendImageToTurboWarp();
        });

        // Desenha no canvas e envia para o TurboWarp
        function sendImageToTurboWarp() {
            const pixels = document.querySelectorAll('.pixel');
            const blockSize = 16; 

            // Limpa o canvas inteiro deixando-o 100% transparente antes de desenhar
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            pixels.forEach((pixel, index) => {
                const x = (index % 16) * blockSize;
                const y = Math.floor(index / 16) * blockSize;
                
                // Só desenha no canvas se o pixel tiver uma cor definida (se for transparente, pula)
                if (pixel.style.backgroundColor) {
                    ctx.fillStyle = pixel.style.backgroundColor;
                    ctx.fillRect(x, y, blockSize, blockSize);
                }
            });

            // Gera o Data URI em PNG (que nativamente suporta transparência)
            const dataURI = canvas.toDataURL('image/png');
            
            // Envia para o projeto do TurboWarp em tempo real
            window.parent.postMessage(dataURI, "*");
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Envia o estado transparente inicial ao carregar
        sendImageToTurboWarp();
    </script>
</body>
</html>
