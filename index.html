<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Paint 16x16 TurboWarp</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(16, 24px);
            grid-template-rows: repeat(16, 24px);
            gap: 1px;
            background-color: #d3d3d3; /* Linhas do grid cinza claro */
            border: 2px solid #d3d3d3;
        }
        .pixel {
            width: 24px;
            height: 24px;
            background-color: #ffffff; /* Fundo branco por padrão */
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="colorPicker">Cor: </label>
        <input type="color" id="colorPicker" value="#000000">
        <button id="clearBtn">Limpar Tudo</button>
    </div>

    <!-- Grid de Pintura -->
    <div id="grid"></div>

    <!-- Canvas HD para gerar o PNG limpo e nítido que o TurboWarp lê -->
    <canvas id="hdCanvas" width="256" height="256" style="display:none;"></canvas>

    <script>
        const grid = document.getElementById('grid');
        const colorPicker = document.getElementById('colorPicker');
        const clearBtn = document.getElementById('clearBtn');
        const canvas = document.getElementById('hdCanvas');
        const ctx = canvas.getContext('2d');

        // Garante que o desenho mantenha bordas duras (Pixel Art nítida)
        ctx.imageSmoothingEnabled = false;

        // Configuração de escrita direta adaptada ao Namespace 'Image' do TurboWarp
        const NAMESPACE = "Image";

        function setTurboWarpKey(key, value) {
            // A extensão do TurboWarp estrutura as chaves adicionando o prefixo do namespace
            const storageKey = `${NAMESPACE}:${key}`;
            localStorage.setItem(storageKey, value);
        }

        function getTurboWarpKey(key) {
            const storageKey = `${NAMESPACE}:${key}`;
            return localStorage.getItem(storageKey);
        }

        // Inicializa valores se estiverem vazios
        if (!getTurboWarpKey('color')) setTurboWarpKey('color', '#000000');
        if (!getTurboWarpKey('image')) setTurboWarpKey('image', '');

        // Define a cor inicial salva
        colorPicker.value = getTurboWarpKey('color') || '#000000';

        // Escuta mudanças de cor
        colorPicker.addEventListener('input', (e) => {
            setTurboWarpKey('color', e.target.value);
        });

        // Monta visualmente o grid 16x16
        for (let i = 0; i < 256; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            
            pixel.addEventListener('click', () => {
                const currentColor = colorPicker.value;
                
                // Sistema de alternar cor (Clique de remoção volta para branco)
                if (pixel.style.backgroundColor === hexToRgb(currentColor)) {
                    pixel.style.backgroundColor = '#ffffff';
                } else {
                    pixel.style.backgroundColor = currentColor;
                }
                
                updateImageURI();
            });

            grid.appendChild(pixel);
        }

        // Botão para limpar a tela
        clearBtn.addEventListener('click', () => {
            document.querySelectorAll('.pixel').forEach(p => p.style.backgroundColor = '#ffffff');
            updateImageURI();
        });

        // Desenha os blocos em alta definição e gera o Data URI em PNG
        function updateImageURI() {
            const pixels = document.querySelectorAll('.pixel');
            const blockSize = 16; // 16x16 blocos em um canvas de 256x256 resulta em pixel art nítida

            pixels.forEach((pixel, index) => {
                const x = (index % 16) * blockSize;
                const y = Math.floor(index / 16) * blockSize;
                
                ctx.fillStyle = pixel.style.backgroundColor || '#ffffff';
                ctx.fillRect(x, y, blockSize, blockSize);
            });

            // Extrai como um Data URL padrão PNG aceito de forma nativa pelo TurboWarp
            const dataURI = canvas.toDataURL('image/png');
            
            // Salva na chave 'image' dentro do escopo do namespace 'Image'
            setTurboWarpKey('image', dataURI);
        }

        // Funções auxiliares para conversão de cores no clique
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Execução inicial para criar a imagem vazia na inicialização
        updateImageURI();
    </script>
</body>
</html>
